; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags =
    !echo "-DPORT=${PORT:-443}"
    !THOST=home.guilledev.com; echo "-DHOST=${HOST:-$THOST}"
    !echo "-DURL=${URL:-/ws/}"
    !echo "-DWSS=${WSS:-1}"
    !echo "-DNETWORK_SSID=\"${NETWORK_SSID}\""
    !echo "-DNETWORK_PASSWORD=${NETWORK_PASSWORD}"
;	-E

[env:esp32-c3-devkitm-1]
platform = espressif32
upload_port = /dev/ttyACM1
board = esp32-c3-devkitm-1
framework = arduino
build_unflags = -std=gnu++11
monitor_rts = 0
extra_scripts = pre:build_views.py
;monitor_dtr = 0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    WebSockets
    ArduinoJson
    FS
    SD
    SPI

[env:tests]
platform = native
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -DPLATFORM_NATIVE=1
    !echo "-DTEST_FILE_PATH=${PWD}/test/host/sent.txt"
;    -DUNITY_INT_WIDTH=16
;    -DUNITY_FLOAT_TYPE=float16_t
lib_deps =
    ArduinoFake
