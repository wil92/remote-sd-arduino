<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote SD files</title>
    <style>$$STYLES$$</style>
</head>
<body>
<main>
    <h1>Upload files</h1>
    <label for="file_input">Choose a file</label>
    <input type="file" id="file_input">
    <button id="upload_button" class="action" type="button">Upload file</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <h2>Files on the SD card</h2>
    <ul>$$FILES$$</ul>
</main>
<script>
    const uploadButton = document.getElementById("upload_button");
    const fileStatus = document.getElementById("status");

    function showError(message) {
        fileStatus.textContent = message;
        fileStatus.classList.toggle("error", true);
    }

    uploadButton.onclick = async function () {
        const file = document.getElementById("file_input").files[0];
        if (!file) {
            showError("Choose a file first.");
            return;
        }
        const data = new FormData();
        data.append("file", file);
        uploadButton.disabled = true;
        try {
            const response = await fetch("/upload", {method: "POST", body: data});
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            location.reload();
        } catch (error) {
            showError(`Upload failed: ${error.message}`);
            uploadButton.disabled = false;
        }
    };

    async function del(fileName) {
        try {
            const response = await fetch(`/?file=${encodeURIComponent(fileName)}`, {method: "DELETE"});
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            location.reload();
        } catch (error) {
            showError(`Delete failed: ${error.message}`);
        }
    }
</script>
</body>
</html>
